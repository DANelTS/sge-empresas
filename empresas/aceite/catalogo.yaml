# Catálogo de la empresa del sector aceite: Cooperativa Olivar del Tajo S. Coop.
#
# Es la definición canónica del sector. generar.py aplica encima la variación de
# cada alumno (precios ±10 %, NIF, IBAN, direcciones y nombres de clientes).
#
# Los tipos de IVA de cada familia están en `categorias`; se aplican a todos los
# productos de la familia salvo que el producto indique `iva_venta`/`iva_compra`.
# Esta empresa es el caso didáctico de los tres tipos en un mismo pedido: 4 %
# para el aceite, 10 % para la despensa y 21 % para cosmética y servicios.

