# Bolsas de nombres, calles y poblaciones para las variantes de Ciclos Rodadura.
#
# El generador baraja estas listas con la semilla (empresa, alumno): cada alumno
# recibe una combinación distinta. Los nombres son inventados; cualquier parecido
# con tiendas, talleres, clubes o personas reales es casualidad.
#
# La bolsa de empresas mezcla talleres y tiendas (los que revenden), empresas con
# flota y clubes deportivos, porque el generador reparte los nombres al azar
# entre todos los clientes que no son particulares.

