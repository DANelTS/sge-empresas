# Catálogo del sector: Ciclos Rodadura S.L. (tienda y taller de bicicletas)
#
# Es la definición canónica del sector «bicicletas». generar.py aplica encima la
# variación de cada alumno (precios ±10 %, NIF, IBAN, direcciones y nombres de
# clientes).
#
# Los tipos de IVA de cada familia están en `categorias`; se aplican a todos los
# productos de la familia salvo que el producto indique `iva_venta`/`iva_compra`.
# En este sector todo va al 21 %: no hay ningún bien ni servicio de tipo
# reducido, pero el taller y el alquiler son servicios y los demás son bienes.

