# Catálogo de la empresa: Vivero La Fresneda S.L.
#
# Centro de jardinería con vivero propio en Colmenar Viejo (Madrid).
# El rasgo didáctico del sector es que en un mismo pedido conviven tres tipos
# de IVA: planta viva y sustratos al 10 %, y herramientas, macetas, decoración
# y servicios al 21 %.
#
# Los tipos de IVA de cada familia están en `categorias`; se aplican a todos los
# productos de la familia salvo que el producto indique `iva_venta`/`iva_compra`.

empresa:
  clave: vivero
  nombre: Vivero La Fresneda
  forma_juridica: S.L.
