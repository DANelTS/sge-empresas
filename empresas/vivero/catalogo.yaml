  actividad: Vivero propio, centro de jardinería y servicios de diseño y mantenimiento de jardines
  epigrafe: "615.3 — Comercio al por menor de plantas y flores"
  cond_pago_ventas: 30 días
  cond_pago_compras: 30 días

