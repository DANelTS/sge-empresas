[options]
; ---------------------------------------------------------------------------
; Configuración de Odoo para el repositorio sge-empresas.
;
; Este fichero es una PLANTILLA. No se usa tal cual: docker/entrada.sh sustituye
; las marcas @...@ por los valores de .env y escribe el resultado en /tmp/odoo.conf
; dentro del contenedor. Así no hay contraseñas en el repositorio.
;
; OJO: el script de arranque de la imagen oficial añade --db_host/--db_user/
; --db_password solo si esos parámetros NO están ya en el fichero de
; configuración. Aquí están, así que la imagen no añade nada.
; ---------------------------------------------------------------------------

addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

db_host = @DB_HOST@
db_port = @DB_PORT@
db_user = @DB_USER@
db_password = @DB_PASSWORD@

; Contraseña maestra del gestor de bases de datos (crear, duplicar, restaurar).
admin_passwd = @ADMIN_PASSWD@

; Ver el gestor de bases de datos en /web/database/manager. Necesario en la UD3.
list_db = True

; Sin servidor de correo en el aula: los envíos quedan en cola.
email_from = False

; Todas las fechas se guardan en UTC. TZ (en docker-compose.yml) solo cambia
; cómo se escriben las horas en el registro.
log_level = info
log_handler = [':INFO']

limit_time_cpu = 300
limit_time_real = 300
