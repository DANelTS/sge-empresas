[options]
; Configuración de Odoo para el repositorio sge-empresas.
;
; Está versionada a propósito, con las contraseñas por defecto de aula:
;   - base de datos: usuario `odoo`, contraseña `odoo`
;   - gestor de bases de datos de Odoo (crear, duplicar, borrar, restaurar): `admin`
;
; No es un descuido: este entorno escucha solo en 127.0.0.1, no sale a la red, y
; el objetivo es que el alumnado no tenga que configurar nada. En un servidor
; real este fichero no se versiona: se genera desde un gestor de secretos y se
; monta en solo lectura.
;
; Si cambias aquí la contraseña de la base, cámbiala también en el servicio `db`
; del docker-compose.yml (POSTGRES_PASSWORD) o el contenedor no conectará.

addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; --- Conexión con PostgreSQL (coincide con el servicio `db` del compose) -----
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; --- Gestor de bases de datos (/web/database/manager) -----------------------
admin_passwd = admin

; Ver la lista de bases en el gestor (necesario en la S16).
list_db = True

; Sin servidor de correo: los envíos quedan en cola.
; (No se pone `email_from`: su valor por defecto ya es vacío.)

; Fechas: se guardan en UTC; TZ del compose solo cambia cómo se escriben en el log.
log_level = info
log_handler = [':INFO']

limit_time_cpu = 300
limit_time_real = 300
