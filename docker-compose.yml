# docker-compose.yml — entorno de trabajo de SGE (Odoo 19 Community + PostgreSQL)
#
# Antes de arrancar la primera vez:
#   cp config/odoo.conf.example config/odoo.conf      (Linux/macOS)
#   copy config\odoo.conf.example config\odoo.conf    (Windows)
#
# Uso normal:
#   docker compose up -d          arranca PostgreSQL y Odoo
#   docker compose logs -f odoo   ver el registro
#   docker compose down           parar (los datos se conservan en volúmenes)
#
# Los datos de la base y el filestore viven en volúmenes con nombre, así que
# "docker compose down" no borra nada. Para borrarlo todo: "docker compose down -v".

name: sge

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: el motor donde Odoo guarda absolutamente todo.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      # Tiene que coincidir con db_password de config/odoo.conf.
      POSTGRES_PASSWORD: odoo
    volumes:
      - datos-bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      # Solo desde este equipo. Sirve para DBeaver o psql (sesión S20).
      - "127.0.0.1:5433:5432"

  # ---------------------------------------------------------------------------
  # Odoo 19 Community. Sin entrypoint propio: la imagen arranca tal cual y lee
  # su configuración de config/odoo.conf.
  # ---------------------------------------------------------------------------
  odoo:
    image: odoo:19.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # 127.0.0.1: solo desde este equipo. Con la contraseña maestra conocida,
      # publicarlo en la red del aula dejaría las bases de los demás al alcance
      # de cualquiera.
      - "127.0.0.1:8069:8069"
    environment:
      TZ: Europe/Madrid
    volumes:
      - datos-odoo:/var/lib/odoo
      # La configuración del alumno. Se monta la CARPETA, no el fichero: montar
      # un fichero que no existe crea un directorio con ese nombre y el error
      # que sale después no hay quien lo lea.
      - ./config:/etc/odoo:ro
      # Módulos propios a partir de la UD4 (vacío por ahora).
      - ./addons:/mnt/extra-addons
      # Solo esta carpeta, y solo para las copias de seguridad.
      - ./salida/copias:/copias
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/login >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Servicio de herramientas: un Python con las dependencias ya instaladas.
  # No hay que instalar Python en Windows. Se usa con "docker compose run":
  #   docker compose run --rm herramientas generar.py --empresa cerveceria --alumno 07
  # Es el único servicio que ve el repositorio, porque lee empresas/ y escribe
  # en salida/. Odoo no lo ve.
  # ---------------------------------------------------------------------------
  herramientas:
    build:
      context: ./herramientas
    image: sge/herramientas:1
    restart: "no"
    depends_on:
      odoo:
        condition: service_started
    working_dir: /repo/herramientas
    entrypoint: ["python3"]
    command: ["-c", "print('Servicio de herramientas. Uso: docker compose run --rm herramientas <script> --ayuda')"]
    environment:
      ODOO_URL: http://odoo:8069
      ODOO_BD: empresa
      ODOO_USUARIO: admin
      ODOO_CLAVE: admin
      TZ: Europe/Madrid
    volumes:
      - ./:/repo

volumes:
  datos-bd:
  datos-odoo:
